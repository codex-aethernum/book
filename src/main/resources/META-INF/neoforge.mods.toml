modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/codex-aethernum/book/issues"

[[mods]]
modId = "codex"
version = "${version}"
displayName = "Codex Aethernum Book"
authors = "Igor Kramar"
description = '''
Книга прогрессии для сборки: разделы, главы и связанные между собой задания
по всем модам. На сервере ведёт прогресс игроков и выдаёт награды; без мода
на сервере работает на клиенте как справочник.
'''
displayTest = "IGNORE_ALL_VERSION"
logoFile = "codex.png"

[[dependencies.codex]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.codex]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"
